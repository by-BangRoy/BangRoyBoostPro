    <meta name="description" content="Aplikasi turbo boost produk TikTok Shop dan Shopee dengan integrasi server, optimasi algoritma SEO, generator konten viral, dan scheduler otomatis." />
    <meta property="og:title" content="BangRoyBoost - TikTok & Shopee Product Booster" />
    <meta property="og:description" content="Aplikasi turbo boost produk TikTok Shop dan Shopee dengan integrasi server, optimasi algoritma SEO, generator konten viral, dan scheduler otomatis." />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Ignore HMR / WebSocket runner errors in sandboxed dev environment per AI Studio guidelines
      window.addEventListener('error', function(event) {
        if (event && (
          (event.message && (event.message.includes('WebSocket') || event.message.includes('createWebSocketModuleRunnerTransport'))) ||
          (event.filename && event.filename.includes('@vite/client'))
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          String(event.reason).includes('WebSocket') ||
          String(event.reason).includes('createWebSocketModuleRunnerTransport') ||
          String(event.reason).includes('@vite/client')
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-orange-500/30 selection:text-orange-200">
    <div id="root"></div>

  </body>
